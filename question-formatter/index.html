<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question Formatter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Output document styling — applied inside #output so it doesn't bleed into the chrome */
    #output {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1f2937;
      line-height: 1.7;
    }
    #output h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 1.25rem 0;
      letter-spacing: -0.01em;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 0.5rem;
    }
    #output h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f172a;
      margin: 1.75rem 0 0.6rem 0;
    }
    #output h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #111827;
      margin: 1.25rem 0 0.5rem 0;
    }
    #output p {
      margin: 0.6rem 0;
    }
    #output ul {
      list-style: disc;
      padding-left: 1.5rem;
      margin: 0.5rem 0;
    }
    #output ol {
      list-style: decimal;
      padding-left: 1.75rem;
      margin: 0.5rem 0;
    }
    #output li {
      margin: 0.25rem 0;
      padding-left: 0.15rem;
    }
    #output li > ul, #output li > ol {
      margin: 0.25rem 0;
    }
    #output strong {
      font-weight: 700;
      color: #0f172a;
    }
    #output a {
      color: #2563eb;
      text-decoration: underline;
    }
    #output code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 0.15rem 0.4rem;
      border-radius: 0.3rem;
      font-size: 0.92em;
      border: 1px solid #e2e8f0;
    }
    #output pre {
      background-color: #0f172a;
      color: #e2e8f0;
      padding: 1rem 1.1rem;
      border-radius: 0.55rem;
      overflow-x: auto;
      margin: 1rem 0;
      font-size: 0.9rem;
      line-height: 1.55;
    }
    #output pre code {
      background: transparent;
      color: inherit;
      padding: 0;
      border: none;
      font-size: inherit;
    }
    #output blockquote {
      border-left: 4px solid #cbd5e1;
      padding: 0.25rem 0 0.25rem 1rem;
      color: #475569;
      margin: 1rem 0;
      font-style: italic;
    }
    #output .table-wrap {
      overflow-x: auto;
      max-width: 100%;
      margin: 1rem 0;
      border-radius: 0.4rem;
    }
    #output table {
      border-collapse: collapse;
      width: 100%;
      margin: 0;
      font-size: 0.95rem;
      border: 1px solid #cbd5e1;
    }
    #output th, #output td {
      border: 1px solid #cbd5e1;
      padding: 0.65rem 0.85rem;
      text-align: left;
      vertical-align: top;
    }
    #output th {
      background-color: #f1f5f9;
      font-weight: 700;
      color: #0f172a;
    }
    #output tr:nth-child(even) td {
      background-color: #f8fafc;
    }
    #output hr {
      border: 0;
      border-top: 1px solid #e5e7eb;
      margin: 1.5rem 0;
    }

    #markdownInput {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.875rem;
      line-height: 1.55;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #0f172a;
      color: #fff;
      padding: 0.7rem 1.1rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
      z-index: 50;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Question Formatter</h1>
        <p class="text-xs text-slate-500 mt-0.5">Turn raw Playwright question markdown into a clean, copy-ready document.</p>
      </div>
      <div class="text-xs text-slate-400">Local · No data leaves your browser</div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-6">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

      <section class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col">
        <div class="px-5 py-3 border-b border-slate-200 flex items-center justify-between">
          <h2 class="font-semibold text-slate-900">Input</h2>
          <div class="flex items-center gap-2">
            <label for="fileInput"
                   class="cursor-pointer inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-md bg-slate-900 text-white hover:bg-slate-800 transition">
              Upload .md
            </label>
            <input id="fileInput" type="file" accept=".md,.markdown,text/markdown,text/plain" class="hidden" />
            <button id="clearBtn"
                    class="text-xs font-medium px-3 py-1.5 rounded-md bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
              Clear
            </button>
            <button id="sampleBtn"
                    class="text-xs font-medium px-3 py-1.5 rounded-md bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
              Load sample
            </button>
          </div>
        </div>
        <div class="p-5 flex-1 flex flex-col">
          <label for="markdownInput" class="text-xs font-medium text-slate-600 mb-1.5">Paste your markdown below</label>
          <textarea id="markdownInput"
                    placeholder="# Your question title&#10;&#10;## Scenario&#10;..."
                    class="w-full flex-1 min-h-[480px] resize-y rounded-lg border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-400"></textarea>
          <p class="text-xs text-slate-500 mt-2">Tip: tight lists, code spans, and bold titles are all preserved on copy.</p>
        </div>
      </section>

      <section class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col">
        <div class="px-5 py-3 border-b border-slate-200 sticky top-[64px] bg-white z-20 rounded-t-xl flex items-center justify-between">
          <h2 class="font-semibold text-slate-900">Generated Output</h2>
          <div class="flex items-center gap-2">
            <button id="copyRichBtn"
                    class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-md bg-emerald-600 text-white hover:bg-emerald-700 transition">
              Copy Rich Text
            </button>
            <button id="copyMdBtn"
                    class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-md bg-slate-900 text-white hover:bg-slate-800 transition">
              Copy as Markdown
            </button>
          </div>
        </div>
        <div class="p-7">
          <article id="output" class="max-w-none">
            <p class="text-slate-400 italic">Your formatted question will appear here.</p>
          </article>
        </div>
      </section>

    </div>
  </main>

  <div id="toast" class="toast">Copied!</div>

  <script>
    const markdownInput = document.getElementById('markdownInput');
    const fileInput = document.getElementById('fileInput');
    const clearBtn = document.getElementById('clearBtn');
    const sampleBtn = document.getElementById('sampleBtn');
    const output = document.getElementById('output');
    const copyRichBtn = document.getElementById('copyRichBtn');
    const copyMdBtn = document.getElementById('copyMdBtn');
    const toast = document.getElementById('toast');

    marked.setOptions({
      gfm: true,
      breaks: true,        // single newlines → <br> (matches how the source markdown is written)
      headerIds: false,
      mangle: false
    });

    /* ---------- Markdown normalization ----------
       Goal: produce HTML that pastes cleanly into rich-text editors (Notion,
       Examly, Google Docs). The big enemy is "loose lists" — when there are
       blank lines between list items, marked wraps each <li>'s content in a
       <p>, and many editors then render that as an empty bullet + a paragraph
       (you saw the empty "3.", "4." rows in the screenshots). So we collapse
       the blank lines between consecutive list items before parsing.            */
    function normalizeMarkdown(src) {
      if (!src) return '';
      let s = src.replace(/\r\n?/g, '\n').replace(/^﻿/, '');
      s = s.split('\n').map(l => l.replace(/[ \t]+$/g, '')).join('\n');

      // Ensure blank line before headings, in case the user pasted them tightly.
      s = s.replace(/([^\n])\n(#{1,6} )/g, '$1\n\n$2');

      // Ensure blank line before tables that follow a paragraph.
      s = s.replace(/([^\n])\n(\|.+\|)\n(\|[\s\-:|]+\|)/g, '$1\n\n$2\n$3');

      // Prevent setext-heading misparsing: when a non-blank line is immediately
      // followed by --- / === / *** / ___, marked turns the text into an <h2>/<h1>.
      // That's why "Tests 23-25 confirm…" was rendering as a giant heading. Insert
      // a blank line so the underline becomes a proper <hr> instead.
      s = s.replace(/^([^\n]+)\n([-*_]{3,}|={3,})[ \t]*$/gm, function(m, prev, dashes) {
        if (prev.trim() === '') return m;
        return prev + '\n\n' + dashes;
      });

      // Collapse blank lines after a "bold-only" line — e.g. test-case
      // headers like `**3. \`confirm_button_visible\`**`. Without this, a
      // user who wrote:
      //
      //   **3. `name`**
      //
      //   Description here.
      //
      // gets two separate <p>s in the rendered HTML, which Examly draws
      // with full paragraph-margin between them — a 2-line gap. A user
      // who wrote the same thing tightly:
      //
      //   **3. `name`**
      //   Description here.
      //
      // gets a single <p> with <br> (because breaks: true), which renders
      // as a 1-line gap. Both forms appear in the same source file, so
      // the spacing comes out inconsistent. Collapsing the blank line
      // makes every test-case header behave like the tight form, giving
      // uniform 1-line spacing across the whole document.
      s = s.replace(/^(\*\*[^*\n]+\*\*)[ \t]*\n\n+(?=[^\s*])/gm, '$1\n');

      s = collapseListBlankLines(s);

      // Collapse 3+ blank lines into 2.
      s = s.replace(/\n{3,}/g, '\n\n');

      return s.trim();
    }

    function collapseListBlankLines(text) {
      const lines = text.split('\n');
      const out = [];
      const isListLine = (l) => /^[ \t]*([-*+]|\d+\.)\s/.test(l);
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].trim() === '') {
          let prev = i - 1;
          while (prev >= 0 && lines[prev].trim() === '') prev--;
          let next = i + 1;
          while (next < lines.length && lines[next].trim() === '') next++;
          if (prev >= 0 && next < lines.length && isListLine(lines[prev]) && isListLine(lines[next])) {
            continue; // drop the blank — keeps the list "tight"
          }
        }
        out.push(lines[i]);
      }
      return out.join('\n');
    }

    /* ---------- HTML post-processing ----------
       Strip <p> wrappers from inside <li>. Many rich-text editors interpret
       <li><p>X</p></li> as two list items (empty + X). With this fix, each
       <li> contains text directly, so the paste keeps the same numbering and
       no phantom empty bullets appear.                                          */
    function postProcessHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;

      tmp.querySelectorAll('li').forEach(li => {
        const ps = Array.from(li.children).filter(c => c.tagName === 'P');
        ps.forEach((p, idx) => {
          if (idx > 0) li.insertBefore(document.createElement('br'), p);
          while (p.firstChild) li.insertBefore(p.firstChild, p);
          p.remove();
        });
      });

      // Wrap tables in a horizontally-scrollable container so wide URL columns
      // don't push the output panel sideways.
      tmp.querySelectorAll('table').forEach(table => {
        if (table.parentElement && table.parentElement.classList.contains('table-wrap')) return;
        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        table.parentNode.insertBefore(wrap, table);
        wrap.appendChild(table);
      });

      return tmp.innerHTML;
    }

    /* ---------- Build paste-friendly HTML for the clipboard ----------
       Two things matter here:
       1) The on-screen <style> rules don't travel with the clipboard, so we
          apply minimal inline styles to tables, code, pre, and headings.
       2) Many rich-text editors (Examly, certain CMS editors) mangle <ol>/<ul>
          on paste — they insert phantom empty <li>s, sometimes 2-3 per real
          item. To dodge this entirely, we *don't ship lists at all* on the
          clipboard. Every <li> becomes a <p> whose text starts with "1. " or
          "• ". The editor sees plain paragraphs, can't fragment them, and the
          user sees a numbered/bulleted layout in the destination thanks to
          the prefix character.                                                  */
    function buildCopyHtml() {
      const div = document.createElement('div');
      div.innerHTML = output.innerHTML;

      applyCopyInlineStyles(div);
      convertTablesToPre(div);     // tables → monospace ASCII <pre> (Examly handles <pre> fine)
      addHeadingSpacers(div);      // blank <p> before & after each heading
      flattenListsToParagraphs(div);
      appendFinalSentinels(div);   // neutral trailing blocks → bullet can't be "last element"

      return div.innerHTML;
    }

    /* Examly's editor auto-promotes the very last block of pasted content to
       a heading-like style — that's why "Tests 23-25 confirm…" kept rendering
       huge no matter what inline styles we put on the <p>. The defense is
       structural: append two neutral sentinels (a styled <p> and a <div>) so
       the user's actual last bullet is no longer the trailing block. The
       editor promotes the sentinel instead, where it's invisible.            */
    function appendFinalSentinels(div) {
      const p = document.createElement('p');
      p.innerHTML = '<br>';
      p.style.margin = '0';
      p.style.padding = '0';
      p.style.fontWeight = 'normal';
      p.style.fontSize = '14px';
      p.style.lineHeight = '1';
      div.appendChild(p);

      const tail = document.createElement('div');
      tail.innerHTML = '&nbsp;';
      tail.style.margin = '0';
      tail.style.padding = '0';
      tail.style.fontWeight = 'normal';
      tail.style.fontSize = '14px';
      tail.style.lineHeight = '1';
      tail.style.color = 'transparent';
      div.appendChild(tail);
    }

    /* Replace each <table> with a <pre> block whose text content is an ASCII
       rendering of the table. Examly's editor strips/breaks real <table>
       elements on paste, but it preserves <pre>. The result is a fixed-width
       table that survives any rich-text editor.                                 */
    function convertTablesToPre(container) {
      container.querySelectorAll('table').forEach(table => {
        const rows = Array.from(table.querySelectorAll('tr'));
        if (!rows.length) return;

        const cellRows = rows.map(row =>
          Array.from(row.querySelectorAll('th, td')).map(cell =>
            (cell.textContent || '').replace(/\s+/g, ' ').trim()
          )
        );

        const numCols = Math.max(...cellRows.map(r => r.length));
        const colWidths = new Array(numCols).fill(0);
        cellRows.forEach(row => {
          for (let i = 0; i < numCols; i++) {
            const len = (row[i] || '').length;
            if (len > colWidths[i]) colWidths[i] = len;
          }
        });

        const formatRow = (row) =>
          colWidths.map((w, i) => (row[i] || '').padEnd(w)).join(' | ');

        const lines = [formatRow(cellRows[0])];
        lines.push(colWidths.map(w => '-'.repeat(w)).join('-+-'));
        for (let i = 1; i < cellRows.length; i++) {
          lines.push(formatRow(cellRows[i]));
        }

        const pre = document.createElement('pre');
        pre.style.background = '#f3f4f6';
        pre.style.padding = '10px 12px';
        pre.style.borderRadius = '4px';
        pre.style.fontFamily = 'Consolas, Monaco, monospace';
        pre.style.fontSize = '0.9em';
        pre.style.whiteSpace = 'pre';
        pre.style.overflowX = 'auto';
        pre.style.margin = '8px 0';
        pre.style.border = '1px solid #ddd';
        pre.style.color = '#0f172a';
        pre.textContent = lines.join('\n');

        // The display wraps tables in <div class="table-wrap"> — replace the
        // wrapper if present so we don't leave an empty container behind.
        const wrapper = table.closest('.table-wrap');
        const target = wrapper || table;
        target.parentNode.replaceChild(pre, target);
      });
    }

    /* After every h1/h2/h3, insert an empty <p> with a <br> inside. Editors
       render this as a blank line, giving the user the requested one-line gap
       between section headings ("Scenario", "Task", …) and their content.     */
    function addHeadingSpacers(container) {
      // !important inline overrides Examly's default <p> margins. Without
      // it, the spacer's own margin stacks on top of the <br>'s line height
      // and the gap becomes 2+ lines instead of the intended 1.
      const makeSpacer = () => {
        const s = document.createElement('p');
        s.innerHTML = '<br>';
        s.setAttribute('style',
          'margin: 0 !important; padding: 0 !important; line-height: 1.4; font-size: 14px;');
        return s;
      };

      const isSpacer = (el) =>
        el && el.tagName === 'P' &&
        el.childNodes.length === 1 &&
        el.firstChild && el.firstChild.tagName === 'BR' &&
        el.textContent.trim() === '';
      const isHeading = (el) => el && /^H[1-6]$/.test(el.tagName);

      // Spacer AFTER every heading — blank line between heading and content.
      container.querySelectorAll('h1, h2, h3').forEach(h => {
        h.insertAdjacentElement('afterend', makeSpacer());
      });

      // Spacer BEFORE every h2/h3 — blank line above each section heading.
      // This is what fixes the "table butts up against Task heading" gap.
      // Skip if the previous block is already a heading or its trailing
      // spacer, so consecutive headings (e.g. h1 then h2) don't get a
      // double blank line between them.
      container.querySelectorAll('h2, h3').forEach(h => {
        const prev = h.previousElementSibling;
        if (!prev) return;
        if (isHeading(prev)) return;
        if (isSpacer(prev) && isHeading(prev.previousElementSibling)) return;
        h.insertAdjacentElement('beforebegin', makeSpacer());
      });
    }

    function applyCopyInlineStyles(div) {
      div.querySelectorAll('table').forEach(t => {
        t.setAttribute('border', '1');
        t.style.borderCollapse = 'collapse';
        t.style.width = '100%';
      });
      div.querySelectorAll('th, td').forEach(c => {
        c.style.border = '1px solid #999';
        c.style.padding = '6px 10px';
        c.style.verticalAlign = 'top';
        c.style.textAlign = 'left';
      });
      div.querySelectorAll('th').forEach(t => {
        t.style.background = '#f3f4f6';
        t.style.fontWeight = 'bold';
      });
      div.querySelectorAll('code').forEach(c => {
        if (c.parentElement && c.parentElement.tagName === 'PRE') return;
        c.style.fontFamily = 'Consolas, Monaco, monospace';
        c.style.background = '#f3f4f6';
        c.style.padding = '1px 4px';
        c.style.borderRadius = '3px';
        c.style.fontSize = '0.95em';
        // Inherit weight from parent. Without this, test-case names like
        // `confirm_button_visible` (which are `<code>` inside `<strong>` from
        // **3. `name`** markdown) render normal-weight because Examly's base
        // stylesheet has `code { font-weight: normal }`.
        c.style.fontWeight = 'inherit';
      });
      div.querySelectorAll('pre').forEach(p => {
        p.style.background = '#f3f4f6';
        p.style.padding = '10px 12px';
        p.style.borderRadius = '4px';
        p.style.fontFamily = 'Consolas, Monaco, monospace';
        p.style.fontSize = '0.9em';
        p.style.whiteSpace = 'pre-wrap';
        p.querySelectorAll('code').forEach(c => {
          c.style.background = 'transparent';
          c.style.padding = '0';
          c.style.fontFamily = 'inherit';
          c.style.border = 'none';
        });
      });
      div.querySelectorAll('h1').forEach(el => {
        el.style.fontSize = '24px';
        el.style.fontWeight = 'bold';
        el.style.margin = '0 0 12px 0';
      });
      div.querySelectorAll('h2').forEach(el => {
        el.style.fontSize = '18px';
        el.style.fontWeight = 'bold';
        el.style.margin = '18px 0 6px 0';
      });
      div.querySelectorAll('h3').forEach(el => {
        el.style.fontSize = '15px';
        el.style.fontWeight = 'bold';
        el.style.margin = '14px 0 4px 0';
      });
    }

    /* Recursively rebuild the tree, replacing every <ol>/<ul> with a flat
       sequence of <p> elements that carry a text prefix ("1. " or "• ") and
       4-NBSPs of indentation per nesting level. Non-list elements pass
       through with their children rebuilt the same way, so a <blockquote>
       containing a list still gets flattened correctly.                         */
    function flattenListsToParagraphs(container) {
      const rebuilt = [];
      Array.from(container.childNodes).forEach(child => {
        const result = transformForCopy(child, 0);
        if (Array.isArray(result)) rebuilt.push(...result);
        else if (result) rebuilt.push(result);
      });
      while (container.firstChild) container.removeChild(container.firstChild);
      rebuilt.forEach(n => container.appendChild(n));
    }

    function transformForCopy(node, indent) {
      // Text and other non-element nodes — clone as-is.
      if (node.nodeType !== Node.ELEMENT_NODE) {
        return node.cloneNode(true);
      }

      if (node.tagName === 'OL' || node.tagName === 'UL') {
        return flattenSingleList(node, indent);
      }

      // Element pass-through: shallow clone, then rebuild children.
      const clone = node.cloneNode(false);
      Array.from(node.childNodes).forEach(child => {
        const result = transformForCopy(child, indent);
        if (Array.isArray(result)) result.forEach(r => clone.appendChild(r));
        else if (result) clone.appendChild(result);
      });
      return clone;
    }

    function flattenSingleList(list, indent) {
      // Old approach: emit one <p> per <li>. That made every bullet a separate
      // paragraph, and Examly stacked its own margins on top of mine, producing
      // 3-line gaps between sections. New approach: collect every line (including
      // nested-list lines) into a single <p> joined by <br>. The destination
      // editor sees one tight block per list, so the only gap that remains is
      // the natural paragraph break between the list and the surrounding text.
      const lines = [];
      collectListLines(list, indent, lines);

      const p = document.createElement('p');
      // !important inline overrides destination-editor default <p> margins
      // — without it Examly was injecting ~1em top/bottom regardless of
      // our inline values.
      p.setAttribute('style',
        'margin: 0 !important; padding: 0 !important; line-height: 1.6; ' +
        'font-weight: normal; font-size: 14px; font-family: inherit;');
      p.innerHTML = lines.join('<br>');
      return [p];
    }

    function collectListLines(list, indent, lines) {
      const isOrdered = list.tagName === 'OL';
      const startAttr = parseInt(list.getAttribute('start') || '1', 10);
      const items = Array.from(list.children).filter(c => c.tagName === 'LI');
      const indentStr = '    '.repeat(indent);

      items.forEach((li, idx) => {
        // Bold prefix via styled <span> rather than <strong>/<b>. Some editors
        // treat leading <strong> as a heading marker.
        const prefix = isOrdered
          ? `<span style="font-weight: bold;">${startAttr + idx}.</span> `
          : `<span style="font-weight: bold;">•</span> `;

        let inlineHtml = '';
        const nestedLists = [];
        Array.from(li.childNodes).forEach(child => {
          if (child.nodeType === Node.ELEMENT_NODE && (child.tagName === 'OL' || child.tagName === 'UL')) {
            nestedLists.push(child);
          } else {
            const tmp = document.createElement('span');
            const transformed = transformForCopy(child, indent);
            if (Array.isArray(transformed)) transformed.forEach(t => tmp.appendChild(t));
            else if (transformed) tmp.appendChild(transformed);
            inlineHtml += tmp.innerHTML;
          }
        });

        lines.push(indentStr + prefix + inlineHtml);

        // Nested lists: recurse with indent+1 into the same lines array so
        // they get emitted as additional <br>-separated rows in the same <p>.
        nestedLists.forEach(nl => collectListLines(nl, indent + 1, lines));
      });
    }

    function render() {
      const raw = markdownInput.value;
      if (!raw.trim()) {
        output.innerHTML = '<p class="text-slate-400 italic">Your formatted question will appear here.</p>';
        return;
      }
      let html = marked.parse(normalizeMarkdown(raw));
      html = postProcessHtml(html);
      output.innerHTML = html;
    }

    markdownInput.addEventListener('input', render);

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        markdownInput.value = ev.target.result || '';
        render();
      };
      reader.readAsText(file);
      fileInput.value = '';
    });

    clearBtn.addEventListener('click', () => {

      render();

    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
    }

    async function copyRichText() {
      if (!output.innerHTML.trim() || output.querySelector('p.italic')) {
        showToast('Nothing to copy');
        return;
      }
      const html = buildCopyHtml();
      const plain = output.innerText;

      try {
        if (navigator.clipboard && window.ClipboardItem) {
          const item = new ClipboardItem({
            'text/html': new Blob([html], { type: 'text/html' }),
            'text/plain': new Blob([plain], { type: 'text/plain' })
          });
          await navigator.clipboard.write([item]);
          showToast('Copied rich text!');
          return;
        }
      } catch (err) { /* fall through to legacy */ }

      try {
        // Legacy fallback: temporarily inject the styled HTML, select, execCommand('copy').
        const stage = document.createElement('div');
        stage.contentEditable = 'true';
        stage.style.position = 'fixed';
        stage.style.left = '-9999px';
        stage.innerHTML = html;
        document.body.appendChild(stage);
        const range = document.createRange();
        range.selectNodeContents(stage);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        const ok = document.execCommand('copy');
        sel.removeAllRanges();
        document.body.removeChild(stage);
        showToast(ok ? 'Copied rich text!' : 'Copy failed');
      } catch (err) {
        showToast('Copy failed');
      }
    }

    async function copyMarkdown() {
      const md = normalizeMarkdown(markdownInput.value);
      if (!md) {
        showToast('Nothing to copy');
        return;
      }
      try {
        await navigator.clipboard.writeText(md);
        showToast('Copied markdown!');
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = md;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(ok ? 'Copied markdown!' : 'Copy failed');
      }
    }

    copyRichBtn.addEventListener('click', copyRichText);
    copyMdBtn.addEventListener('click', copyMarkdown);
